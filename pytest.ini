[pytest]
# Unit tests = fast, no heavy ML deps, no network. These are the always-green CI gate.
# Integration tests (live services / redis / postgres) live under tests/integration and
# are marked @pytest.mark.integration — run them via: pytest -m integration
markers =
    integration: requires running services / redis / postgres (not run in unit CI)
testpaths =
    GPU/shared/tests
    GPU/yolo/tests
    services/ingestion/tests
    services/correlation/tests
    services/alerting/tests
    services/_supervisor/tests
    tests
addopts = -ra -q --strict-markers
norecursedirs = *venv* node_modules __pycache__ *.egg
