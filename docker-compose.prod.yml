x-restart: &restart
  restart: unless-stopped

x-py-common: &py-common
  restart: unless-stopped
  build:
    context: .        # repo root — all services need GPU/shared
  networks:
    - internal

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    <<: *restart
    image: mailhog/mailhog:latest
    networks:
      - internal
    ports:
      - "8025:8025"   # web UI — expose only on LAN / behind auth in prod

  # ── Python micro-services ─────────────────────────────────────────────────

  ingestion:
    <<: *py-common
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      # Override source video: INGEST_SOURCE_URI=/data/your-video.mp4
    depends_on:
      redis:
        condition: service_healthy

  frame-extractor:
    <<: *py-common
    build:
      context: .
      dockerfile: services/frame_extractor/Dockerfile
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  sync-engine:
    <<: *py-common
    build:
      context: .
      dockerfile: services/sync_engine/Dockerfile
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  correlation:
    <<: *py-common
    build:
      context: .
      dockerfile: services/correlation/Dockerfile
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  report-generator:
    <<: *py-common
    build:
      context: .
      dockerfile: services/report_generator/Dockerfile
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  yolo:
    <<: *py-common
    build:
      context: .
      dockerfile: GPU/yolo/Dockerfile
      # CPU build: add --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu
    env_file: backend/.env
    volumes:
      # best.pt and train_num_detector.pt live on the host — never in Git.
      # First-time setup: scp GPU/yolo/models/*.pt user@vps:/srv/vandebharat/models/
      - /srv/vandebharat/models:/models:ro
    # Uncomment if the VPS has an NVIDIA GPU and nvidia-container-toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ocr:
    <<: *py-common
    build:
      context: .
      dockerfile: GPU/ocr/Dockerfile
    env_file: backend/.env
    depends_on:
      - yolo

  # ── Node.js backend ───────────────────────────────────────────────────────

  backend:
    <<: *restart
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      FRAME_EXTRACTOR_URL:  http://frame-extractor:5003
      OCR_SERVICE_URL:      http://ocr:5000
      YOLO_SERVICE_URL:     http://yolo:5002
      SYNC_ENGINE_URL:      http://sync-engine:5004
      CORRELATION_URL:      http://correlation:5005
      REPORT_GENERATOR_URL: http://report-generator:5006
    ports:
      - "8001:8001"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React frontend (nginx) ────────────────────────────────────────────────

  frontend:
    <<: *restart
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The public URL of the backend — whatever domain/port Coolify exposes.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
