# Throwaway infra for the integration test tier (Phase B0).
#   docker compose -f docker-compose.test.yml up -d
#   REDIS_URL=redis://127.0.0.1:6379 (backend)  HEALTH_HOST=127.0.0.1 (services)
# Then: cd backend && REDIS_URL=redis://127.0.0.1:6379 npm test
#       pytest -m integration
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI / API (assert captured mail here)

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vande
      POSTGRES_PASSWORD: vande
      POSTGRES_DB: vande_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vande"]
      interval: 2s
      timeout: 3s
      retries: 10
